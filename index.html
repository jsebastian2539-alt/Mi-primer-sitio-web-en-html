<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Tienda</title>
</head>
<body>
    <div class="encabezado">
        <div class="encabezado_img">
            <img class="imagen_logo" src="/imagenes/logoEmpresa.jpg" alt="">
        </div>

        <div class="buscador">
            <input id="buscador" type="text" placeholder="🔎 ¡Busca lo que quieras!">
            <button id="btn_buscar" type="submit">Buscar</button>
        </div>
    
        <div class="btn_encabezado">
            <ul>
                <li><a>Ubicacion</a></li>
                <li><a>Ingresar</a></li>
                <li><a>Mi Carrito</a></li>
            </ul>
        </div>
    </div>

    <div class="slider">
        <div class="slides">
            <img src="https://speedy.uenicdn.com/1493dae6-b575-40e3-b9bb-ae9eae6d2423/c512_a/image/upload/v1596060728/business/84c0f551-574c-4ffe-b2a8-dd6842797cbc.jpg" class="slide active">
            <img src="img/banner2.jpg" class="slide">
            <img src="img/banner3.jpg" class="slide">
        </div>

        <button class="prev">&#10094;</button>
        <button class="next">&#10095;</button>
    </div>

    <div class="contenido">
        
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
